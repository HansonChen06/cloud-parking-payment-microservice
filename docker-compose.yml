services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: cloud-parking-payment-microservice
      ENVIRONMENT: local
      DATABASE_URL: sqlite:///./parking.sqlite3
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
